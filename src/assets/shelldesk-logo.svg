<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e27"/>
      <stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板：深色圆角方块 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- 内描边 -->
  <rect x="30" y="30" width="452" height="452" rx="96" fill="none"
        stroke="#ffb000" stroke-opacity="0.35" stroke-width="4"/>
  <!-- 顶部高光 -->
  <rect x="30" y="30" width="452" height="120" rx="96" fill="#ffffff" fill-opacity="0.03"/>

  <!-- 终端符号 ▸_ -->
  <g filter="url(#glow)">
    <!-- 提示符三角箭头 -->
    <path d="M148 168 L268 256 L148 344 L148 296 L212 256 L148 216 Z" fill="url(#amber)"/>
    <!-- 光标下划线 -->
    <rect x="292" y="316" width="118" height="34" rx="10" fill="url(#amber)"/>
  </g>
</svg>
